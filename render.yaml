services:
  - type: web
    name: proyecto-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: |
      npm install
      node migrate.js
    startCommand: node app.js
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: "https://smaguayaquil.com,https://www.smaguayaquil.com,http://localhost:4200,https://proyecto-frontend-qxik.onrender.com,https://proyecto-frontend-qxik.onrender.com/servicios"
  - type: static
    name: proyecto-frontend
    rootDir: frontend/iglesia
    buildCommand: |
      npm install
      npm run build -- --configuration production
    publishPath: dist/iglesia/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html