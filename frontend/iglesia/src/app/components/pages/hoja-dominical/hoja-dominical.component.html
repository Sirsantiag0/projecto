<div class="hoja-container">
  <!-- Selector de fecha -->
  <input type="date" [(ngModel)]="fechaSeleccionada" (change)="buscarHoja()" class="fecha-input" />

  <!-- Título del PDF -->
  <div class="titulo-pdf">
    {{ tituloPdf || 'TITULO DEL PDF' }}
  </div>

  <!-- Botón Descargar -->
  <button class="descargar-btn" (click)="descargarPdf()" [disabled]="!rutaPdf">
    Descargar 📥
  </button>
</div>
