<div class="overlay" (click)="close()">
  <div class="login-window" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="close()">✖</button>
        <h2 class="login-title">Inicia Sesión</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="field">
          <input #correoInput 
          class="usuario" 
          type="email" 
          formControlName="correo" 
          placeholder="correo" />
          <div class="error" *ngIf="form.get('correo')?.touched && form.get('correo')?.hasError('required')">
            El correo es requerido
          </div>
          <div class="error" *ngIf="form.get('correo')?.touched && form.get('correo')?.hasError('email')">
            Ingrese un correo válido
          </div>
        </div>

        <div class="field">
          <input type="password" formControlName="password" placeholder="contraseña">
          <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">La contraseña es requerida</div>
        </div>
      <small class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </small>
      <button type="submit" [disabled]="loading">
        Ingresar
        <span *ngIf="loading" class="spinner"></span>
      </button>
      <button class="registarme" routerLink="/registrar" (click)="close()">
        Registarme
      </button>
    </form>
  </div>
</div>
