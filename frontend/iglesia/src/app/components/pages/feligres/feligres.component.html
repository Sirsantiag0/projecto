<h2>Mis grupos</h2>
<div class="group-cards">
  <mat-card
    *ngFor="let grupo of grupos()"
    class="group-card"
    [style.background-image]="'url(' + grupo.ruta_archivo + ')'"
  >
    <div class="group-title">{{ grupo.titulo }}</div>
  </mat-card>
</div>

<h2>Mis eventos</h2>
<div class="event-cards">
  <mat-card *ngFor="let evento of eventos()">
    <mat-card-title>{{ evento.descripcion }}</mat-card-title>
    <mat-card-content>
      <p>{{ evento.fecha }} - {{ evento.hora }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-button
        color="warn"
        (click)="eliminarAsistencia(evento.asistenciaId)"
      >
        Eliminar
      </button>
    </mat-card-actions>
  </mat-card>
</div>
