<div class="asistente-form">
  <h2>Subir 🖼️Horario 🖼️Carrusel 🖼️Evento</h2>
  <input type="text" [(ngModel)]="detalle" placeholder="Detalle" />
  <input type="file" (change)="onFileChange($event)" />
  <button (click)="subirImagen()">Subir</button>
</div>

<div class="lista-imagenes" *ngIf="imagenes.length">
  <h3>Imágenes subidas: </h3>
  <div class="imagen-item" *ngFor="let img of imagenes">
    <p>{{ img.detalle }}</p>
    <img [src]="'http://localhost:3000/uploads/' + img.ruta_archivos" [alt]="img.detalle" />
        <div class="acciones">
      <button (click)="eliminarImagen(img.id)">Eliminar</button>
      <input type="file" (change)="reemplazarImagen(img, $event)" hidden #fileInput />
      <button (click)="fileInput.click()">Reemplazar</button>
    </div>
      </div>
</div>

<div class="video-inputs">
  <h3>Subir 📹Videos</h3>
  <div class="video-input" *ngFor="let url of videoUrls; index as i">
    <input type="text" [(ngModel)]="videoUrls[i]" placeholder="URL de YouTube" />
  </div>
  <button (click)="guardarVideos()">Guardar videos</button>
</div>

<div class="event-schedule">
  <h3>Programar 📅evento</h3>
  <input type="date" [(ngModel)]="nuevoEvento.fecha" />
  <input type="time" [(ngModel)]="nuevoEvento.hora" />
  <input type="text" [(ngModel)]="nuevoEvento.descripcion" placeholder="Descripción" />
  <button (click)="guardarEvento()">{{ editingId ? 'Actualizar' : 'Agregar' }} evento</button>
</div>

<div class="event-preview" *ngIf="eventos.length">
  <h3>Eventos 📝programados</h3>
  <div class="event-item" *ngFor="let ev of eventos; trackBy: trackById">
    <span>{{ ev.fecha | date:'yyyy-MM-dd' }} - {{ ev.hora }} - {{ ev.descripcion }}</span>
    <div class="acciones">
      <button (click)="editarEvento(ev)">Editar</button>
      <button *ngIf="ev.id" (click)="eliminarEvento(ev.id)">Eliminar</button>
    </div>
  </div>
</div>

<div class="group-section">
  <h3>Agregar 👪grupo</h3>
  <input type="file" (change)="onGrupoFileChange($event)" />
  <input type="text" [(ngModel)]="grupoDescripcion" placeholder="Descripción del grupo" />
  <button (click)="agregarGrupo()">Guardar grupo</button>

  <div class="lista-grupos" *ngIf="grupos.length">
    <h3>Grupos agregados</h3>
    <div class="grupo-item" *ngFor="let g of grupos">
      <p>{{ g.descripcion }}</p>
      <img *ngIf="g.imagen" [src]="'http://localhost:3000/uploads/grupos/' + g.imagen" [alt]="g.descripcion" />
    </div>
  </div>
</div>
